name: tests

on:
  push:
  pull_request:

jobs:
  simulation:
    name: Levels and game rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every level (JavaScript checker)
        run: node tools/levelcheck.mjs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile the simulation and run the C# tests
        run: dotnet test tests/EchoShift.Simulation.Tests -c Release --logger "console;verbosity=normal"
